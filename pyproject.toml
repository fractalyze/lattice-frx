# lattice-frx builds via Bazel (MODULE.bazel) and is consumed two ways: as a
# bzlmod module (`bazel_dep` + `git_override`), and as a wheel from a pip lock.
# The packaging tables below serve the second.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-frx"
dynamic = ["version"]
description = "lattice-frx — scheme-agnostic lattice substrate: negacyclic NTT rings, RNS/CRT basis conversion, and exact discrete Gaussian samplers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The lattice-frx Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# numpy for the host reference ring, frx and zk-dtypes for the device one, and
# nothing else — a design constraint rather than a coincidence. This package
# sits below enc-frx and sig-frx, which each carry a lattice scheme, so
# depending on either would make their adoption of this substrate circular;
# frx and zk-dtypes are the array layer those two already sit on, so they
# close no loop. A consumer that needs a CSPRNG behind the uniform sampler, or
# a hash behind a Fiat-Shamir transcript, still injects it. scipy is test-only.
#
# The frx floor carries the `.dev0` sentinel rather than being a plain
# `>=0.10.2`, because a consuming workspace pins an exact continuously-bumped
# dev build and `0.10.2.devN` sorts BELOW `0.10.2` — a plain floor would reject
# the very pin `requirements.in` sets. frx is published on the Fractalyze
# index, not PyPI, so an install needs
# `--extra-index-url=https://fractalyze.github.io/pypi/simple/`.
dependencies = ["numpy", "frx>=0.10.2.dev0", "zk-dtypes>=0.0.14"]

[project.optional-dependencies]
dev = ["absl-py", "scipy"]

[project.urls]
Repository = "https://github.com/fractalyze/lattice-frx"

[tool.setuptools.dynamic]
version = { attr = "lattice_frx.__version__" }

# Ship the runtime tree only; `testing/` holds the suite, not package API.
[tool.setuptools.packages.find]
where = ["."]
include = ["lattice_frx*"]
exclude = ["lattice_frx.testing", "lattice_frx.testing.*"]
